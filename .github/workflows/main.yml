name: Build and Deploy Snapshot
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional space-separated surefire test selector"
        required: false
        default: ""
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java_version: ['8', '11', '17']
        os: ['ubuntu-latest']
    env:
      JAVA_OPTS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"
    steps:
    - uses: actions/checkout@v3.5.2
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java_version }}
        cache: 'maven'
        server-id: sonatype-nexus-snapshots
        server-username: CI_DEPLOY_USERNAME
        server-password: CI_DEPLOY_PASSWORD
        # See https://github.com/actions/setup-java/blob/v2/docs/advanced-usage.md#Publishing-using-Apache-Maven
        # gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }} # Value of the GPG private key to import
        # gpg-passphrase: MAVEN_GPG_PASSPHRASE # env variable for GPG private key passphrase
    - name: Build
      shell: bash
      env:
        FILTER: ${{ inputs.test-filter }}
      run: |
        if [ -n "$FILTER" ]; then
          ./mvnw -B -ff -ntp clean verify -Dtest="${FILTER// /,}" -Dsurefire.failIfNoSpecifiedTests=false
        else
          ./mvnw -B -ff -ntp clean verify
        fi
    - name: Report skipped tests
      if: always()
      shell: bash
      run: |
        python3 - <<'PY'
        import glob, xml.etree.ElementTree as ET
        n = 0
        for f in glob.glob('target/surefire-reports/TEST-*.xml'):
            for tc in ET.parse(f).getroot().iter('testcase'):
                sk = tc.find('skipped')
                if sk is not None:
                    n += 1
                    print("SKIPPED: %s.%s -- %s" % (tc.get('classname'), tc.get('name'), sk.get('message') or (sk.text or '').strip() or 'no reason given'))
        print("Total skipped test cases: %d" % n)
        PY
    - name: Upload jar
      if: matrix.java_version == '8'
      uses: actions/upload-artifact@v4
      with:
        name: jackson-databind-jar
        path: target/jackson-databind-*[0-9].jar
        if-no-files-found: error
    - name: Extract project Maven version
      id: projectVersion
      run: echo "version=$(./mvnw org.apache.maven.plugins:maven-help-plugin:3.3.0:evaluate -DforceStdout -Dexpression=project.version -q)" >> $GITHUB_OUTPUT
    - name: Deploy snapshot
      if: false && github.event_name != 'pull_request' && matrix.java_version == '8' && endsWith(steps.projectVersion.outputs.version, '-SNAPSHOT')
      env:
        CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
        CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
        # MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      run: ./mvnw -B -q -ff -DskipTests -ntp source:jar deploy
    - name: Generate code coverage
      if: github.event_name != 'pull_request' && matrix.java_version == '8'
      run: ./mvnw -B -q -ff -ntp test
    - name: Publish code coverage
      if: false && github.event_name != 'pull_request' && matrix.java_version == '8'
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./target/site/jacoco/jacoco.xml
        flags: unittests
